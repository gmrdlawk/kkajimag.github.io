<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKAJI - PHOTO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            line-height: 1.6;
            padding-bottom: 80px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* 1. 상단 내비게이션 바 (영문 변경) */
        .navbar {
            background-color: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eeeeee;
        }
        .navbar .logo-link {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .navbar .nav-links a {
            margin-left: 25px;
            color: #666666;
            font-weight: 700;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .navbar .nav-links a.active, 
        .navbar .nav-links a:hover {
            color: #111111;
        }

        /* 2. 메인 컨테이너 */
        .photo-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .page-desc {
            font-size: 1rem;
            color: #666666;
            margin-bottom: 40px;
        }

        /* 3. 포토 갤러리 그리드 (3열) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        /* 개별 포토 카드 */
        .photo-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #ffffff;
            border-radius: 6px;
            transition: transform 0.2s ease;
        }
        .photo-card:hover {
            transform: translateY(-4px);
        }

        .photo-card .photo-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #f0f0f0;
            border-radius: 4px;
        }

        .photo-card .photo-info {
            padding: 12px 0 0 0;
        }

        .photo-card .photo-tag {
            font-size: 0.75rem;
            font-weight: 800;
            color: #3498db;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .photo-card .photo-caption {
            font-size: 1rem;
            font-weight: 700;
            color: #111111;
            margin-bottom: 4px;
        }

        .photo-card .photo-date {
            font-size: 0.8rem;
            color: #888888;
        }

        /* 반응형 스타일 (모바일/패드 대응) */
        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            .navbar {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 🌐 영문 내비게이션 바 -->
    <nav class="navbar">
        <a href="index.html" class="logo-link">까지</a>
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="photo.html" class="active">PHOTO</a>
            <a href="news.html">NEWS</a>
            <a href="news.html">ABOUT</a>
        </div>
    </nav>

    <main class="photo-container">
        
        <h1 class="page-title">PHOTO</h1>
        <p class="page-desc">Visual moments from concerts, festivals, and cultural events in Korea.</p>

        <!-- 🖼️ 사진 갤러리 카드 영역 -->
        <div class="gallery-grid">

            <!-- [사진 1] -->
            <div class="photo-card">
                <img src="one.jpg" alt="XMF Festival" class="photo-img">
                <div class="photo-info">
                    <span class="photo-tag">FESTIVAL</span>
                    <h3 class="photo-caption">XMF Festival 2026</h3>
                    <span class="photo-date">INCHEON · Oct 2026</span>
                </div>
            </div>

            <!-- [사진 2] -->
            <div class="photo-card">
                <img src="sil.jpg"alt="XMF Festival" class="photo-img">
                <div class="photo-info">
                    <span class="photo-tag">FESTIVAL</span>
                    <h3 class="photo-caption">XMF Festival 2026</h3>
                    <span class="photo-date">INCHEON · Oct 2026</span>
                </div>
            </div>

            <!-- [사진 3] -->
            <div class="photo-card">
                <img src="xds.jpg" alt="XMF Festival" class="photo-img">
                <div class="photo-info">
                    <span class="photo-tag">FESTIVAL</span>
                    <h3 class="photo-caption">XMF Festival 2026</h3>
                    <span class="photo-date">INCHEON · Oct 2026</span>
                </div>
            </div>

            <!-- 📌 새로운 사진을 추가할 때는 아래 가이드를 참고하세요! -->

        </div>

    </main>

</body>
</html>
